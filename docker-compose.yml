services:
  mysql:
    image: mysql:8.4
    container_name: quimovia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3333:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - quimovia-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quimovia-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador do Sistema}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@quimovia.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123@}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - quimovia-net

volumes:
  mysql_data:

networks:
  quimovia-net:
    driver: bridge